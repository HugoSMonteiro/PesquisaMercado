name: Monitoramento de Cat�logo e Vendas

on:
  schedule:
    - cron: '0 * * * *'   # A cada hora
  workflow_dispatch:       # Permite rodar manualmente

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do reposit�rio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar depend�ncias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de monitoramento
        run: python executar_catalogo.py

      - name: Commit e push dos arquivos gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f historico/ catalogo_geral.csv catalogo_por_categoria.csv movimentacoes.csv vendas_acumuladas.csv produtos_sem_estoque.csv 2>/dev/null || true
          git commit -m "Atualiza��o autom�tica do monitoramento [skip ci]" || echo "Nada para commitar"
          git push

name: Monitoramento de Catálogo e Vendas

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de monitoramento
        run: python executar_catalogo.py

      - name: Commit e push dos arquivos gerados
        run: |
             git config user.name "github-actions[bot]"
             git config user.email "github-actions[bot]@users.noreply.github.com"
             git add historico/ catalogo_geral.csv catalogo_por_categoria.csv movimentacoes.csv vendas_acumuladas.csv produtos_sem_estoque.csv 2>/dev/null || true
             git commit -m "Atualização automática do monitoramento [skip ci]" || echo "Nada para commitar"
             git pull --rebase origin main
             git push
